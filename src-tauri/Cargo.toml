[package]
name = "universal-gene-tool"
version = "0.1.0"
description = "Universal Gene Tool — genomics file converter"
authors = ["Robin"]
edition = "2021"

[lib]
name = "universal_gene_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
converter-core = { path = "../crates/converter-core" }
flate2 = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
