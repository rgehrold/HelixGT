[package]
name = "converter-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Genomics file format conversion for HelixGT"

[dependencies]
anyhow = "1"
flate2 = "1"
noodles = { version = "0.87", features = ["fasta", "fastq", "sam", "vcf", "gff", "bed", "cram", "bam", "bgzf", "core"] }
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"